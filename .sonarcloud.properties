# Analyse automatique SonarCloud : le code de test (tests unitaires *.spec.ts et parcours de
# bout en bout de test/) est déclaré comme tel, distinct du code de production.
sonar.sources=.
sonar.exclusions=**/*.spec.ts,test/**,assets/**,coverage/**,dist/**,storage/**
sonar.tests=.
sonar.test.inclusions=**/*.spec.ts,test/**
